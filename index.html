<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#050806" />
    <title>Jaime García-Page</title>
    <meta
      name="description"
      content="Desarrollador backend y middleware en Java. C++, ensamblador, reverse engineering y herramientas para agentes de código."
    />
    <link rel="canonical" href="https://jaimegpm.github.io/Portfolio/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jaime García-Page" />
    <meta
      property="og:description"
      content="Desarrollador backend y middleware en Java. C++, ensamblador, reverse engineering y herramientas para agentes de código."
    />
    <meta property="og:url" content="https://jaimegpm.github.io/Portfolio/" />
    <meta property="og:image" content="https://jaimegpm.github.io/Portfolio/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/doto-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        try {
          var light = localStorage.getItem('theme') === 'light';
          document.documentElement.dataset.theme = light ? 'light' : 'dark';
          if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f2f3ea');
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
